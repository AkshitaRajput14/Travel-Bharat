<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destinations | TravelBharat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
  <div class="container nav-inner">
    <a class="logo" href="/">Travel<span>Bharat</span></a>
    <nav><a href="/">Home</a><a class="active" href="destinations.html">Destinations</a><a href="/#categories">Categories</a><a href="admin.html">Admin</a></nav>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
  </div>
</header>

<main>
<section class="page-banner">
  <div class="container"><p class="eyebrow">TRAVELBHARAT DIRECTORY</p><h1>Explore Destinations</h1><p>Search and filter tourist places across India.</p></div>
</section>

<section class="section">
  <div class="container">
    <div class="filters">
      <input id="searchInput" type="text" placeholder="Search place, state, city or category...">
      <select id="stateFilter"><option value="all">All States</option></select>
      <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option>Heritage</option><option>Nature</option><option>Religious</option><option>Adventure</option>
      </select>
      <button class="btn" onclick="loadDestinations()">Search</button>
    </div>
    <p id="resultCount" class="result-count"></p>
    <div id="destinationGrid" class="destination-grid"></div>
  </div>
</section>
</main>

<footer><div class="container footer-inner"><div><a class="logo" href="/">Travel<span>Bharat</span></a><p>A digital travel encyclopedia of India.</p></div><p>© 2026 TravelBharat</p></div></footer>
<script src="script.js"></script>
<script src="destinations.js"></script>
</body>
</html>
